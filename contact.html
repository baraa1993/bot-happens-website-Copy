
<form class="form" id="inquiry-form"
      action="https://formsubmit.co/Baraa.anani93@gmail.com"
      method="POST">

  <h3>Project inquiry</h3>

  <input type="hidden" name="_subject" value="New Bot Happens Project Inquiry">
  <input type="hidden" name="_template" value="table">

  <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

  <label>Full name
    <input name="name" required autocomplete="name" placeholder="Your name">
  </label>

  <label>Business email
    <input name="email" type="email" required autocomplete="email" placeholder="you@company.com">
  </label>

  <label>Company name
    <input name="company" placeholder="Your company">
  </label>

  <label>What would you like help with?
    <select name="service" required>
      <option value="">Choose a service</option>
      <option>Intercom consulting</option>
      <option>Customer support operations</option>
      <option>AI and automation</option>
      <option>Workflow optimization</option>
      <option>Reporting and analytics</option>
      <option>Zendesk and Salesforce consulting</option>
      <option>SOPs and knowledge base development</option>
      <option>Customer experience strategy</option>
      <option>Custom engagement</option>
    </select>
  </label>

  <label>Project budget (optional)
    <select name="budget">
      <option value="">Prefer not to say</option>
      <option>Under $500</option>
      <option>$500–$1,500</option>
      <option>$1,500–$5,000</option>
      <option>$5,000+</option>
      <option>Not sure yet</option>
    </select>
  </label>

  <label>Tell us about your project
    <textarea name="message" required placeholder="What are you trying to improve?"></textarea>
  </label>

  <button class="btn" type="submit">Submit Project Inquiry</button>
</form>
